[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# ── Domain migration: osmoz.work → osmoz-space.com ───────────────────
[[redirects]]
  from = "http://osmoz.work/*"
  to = "https://osmoz-space.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://osmoz.work/*"
  to = "https://osmoz-space.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.osmoz.work/*"
  to = "https://osmoz-space.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.osmoz.work/*"
  to = "https://osmoz-space.com/:splat"
  status = 301
  force = true

# ── Legacy / removed URLs ────────────────────────────────────────────
[[redirects]]
  from = "/legal/privacy"
  to = "/politique-de-confidentialite"
  status = 301
  force = true

[[redirects]]
  from = "/legal/terms"
  to = "/mentions-legales"
  status = 301
  force = true

[[redirects]]
  from = "/spaces/patio-osmoz"
  to = "/spaces"
  status = 301
  force = true

# Force www to non-www
[[redirects]]
  from = "https://www.osmoz-space.com/*"
  to = "https://osmoz-space.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.osmoz-space.com/*"
  to = "https://osmoz-space.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://osmoz-space.com/*"
  to = "https://osmoz-space.com/:splat"
  status = 301
  force = true

# ── English version ──────────────────────────────────────────────────
# Les pages EN sont des fichiers plats pré-rendus (dist/en.html, dist/en/…).
# Les articles n'existent qu'en français : /en/articles/* → 301 vers l'article FR.
[[redirects]]
  from = "/en/articles/*"
  to = "/articles/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/en/articles"
  to = "/articles"
  status = 301
  force = true

# ── 404 (must be last) ───────────────────────────────────────────────
# Toutes les routes indexables sont des fichiers plats servis avant cette
# règle. Une URL inconnue reçoit dist/404.html (noindex) en HTTP 404 — plus
# de soft-404 servant la home en 200.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[dev]
  framework = "vite"
  targetPort = 5173
  port = 8888